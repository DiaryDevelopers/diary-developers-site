<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>index</title>
    <link rel="stylesheet" href="./css/font-awesome.min.css">
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>

    <div class="wrapper">

        <aside class="aside">
            <div class="aside-content">
                <a href="./index.html" class="aside-logo">
                    <img src="images/logo_light.png" alt="logo" id="dd_logo">
                </a>
                <ul class="aside-list">
                    <li class="aside-item">
                        <a href="./index.html" class="aside-link">
                            <span class="aside-link__icon">
                                <i class="fa fa-home" aria-hidden="true"></i>
                            </span>
                            <span class="aside-link__text">Главная</span>
                        </a>
                    </li>
                    <li class="aside-item">
                        <a href="portfolio.html" class="aside-link">
                            <span class="aside-link__icon">
                                <i class="fa fa-address-card" aria-hidden="true"></i>
                            </span>
                            <span class="aside-link__text">Портфолио</span>
                        </a>
                    </li>
                    <li class="aside-item">
                        <a href="diary.html" class="aside-link">
                            <span class="aside-link__icon">
                                <i class="fa fa-book" aria-hidden="true"></i>
                            </span>
                            <span class="aside-link__text">Дневник</span>
                        </a>
                    </li>
                    <li class="aside-item">
                        <a href="chat.html" class="aside-link">
                            <span class="aside-link__icon">
                                <i class="fa fa-comments-o" aria-hidden="true"></i>
                            </span>
                            <span class="aside-link__text">Чаты</span>
                        </a>
                    </li>
                    <li class="aside-item">
                        <a href="food.html" class="aside-link">
                            <span class="aside-link__icon">
                                <i class="fa fa-coffee" aria-hidden="true"></i>
                            </span>
                            <span class="aside-link__text">Питание</span>
                        </a>
                    </li>
                    <li class="aside-item">
                        <a href="reports.html" class="aside-link">
                            <span class="aside-link__icon">
                                <i class="fa fa-file-word-o" aria-hidden="true"></i>
                            </span>
                            <span class="aside-link__text">Отчёты</span>
                        </a>
                    </li>
                    <li class="aside-item">
                        <a href="profile.html" class="aside-link">
                            <span class="aside-link__icon">
                                <i class="fa fa-user" aria-hidden="true"></i>
                            </span>
                            <span class="aside-link__text">Профиль</span>
                        </a>
                    </li>
                    <li class="aside-item">
                        <a href="settings.html" class="aside-link active">
                            <span class="aside-link__icon">
                                <i class="fa fa-cog" aria-hidden="true"></i>
                            </span>
                            <span class="aside-link__text">Настройки</span>
                        </a>
                    </li>
                </ul>
            </div>
        </aside>

        <main class="main">
            
            <div class="settings">
                <div class="menu-toggle">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <div class="block-title">
                    <span class="block-title__icon">
                        <i class="fa fa-cog" aria-hidden="true"></i>
                    </span>
                    <span class="block-title__text">Настройки</span>
                </div>

                <div class="settings-blocks">

                    <div class="settings-block">
                        <div class="block-title">
                            <span class="block-title__icon">
                                <i class="fa fa-wrench" aria-hidden="true"></i>
                            </span>
                            <span class="block-title__text">Пароль</span>
                        </div>
                        <form action="/" class="settings-form">
                            <div class="h2">Изменить пароль</div>
                            <div class="form-item">
                                <input type="password" name="password" id="password" placeholder="Пароль" required>
                            </div>
                            <div class="form-item">
                                <input type="password" name="password_replay" id="password_replay" placeholder="Повтор пароля" required>
                            </div>
                            <button class="button">Сменить пароль</button>
                        </form>
                    </div>

                    <div class="settings-block">
                        <div class="block-title">
                            <span class="block-title__icon">
                                <i class="fa fa-envelope-o" aria-hidden="true"></i>
                            </span>
                            <span class="block-title__text">Почта</span>
                        </div>
                        <form action="/" class="settings-form">
                            <div class="h2">Сменить почту</div>
                            <div class="form-item">
                                <input type="email" name="email" id="email" placeholder="Старая почта" required>
                            </div>
                            <div class="form-item">
                                <input type="email" name="email_old" id="email_old" placeholder="Новая почта" required>
                            </div>
                            <button class="button">Сменить почту</button>
                        </form>
                    </div>

                    <div class="settings-block">
                        <div class="block-title">
                            <span class="block-title__icon">
                                <i class="fa fa-tachometer" aria-hidden="true"></i>
                            </span>
                            <span class="block-title__text">Тема</span>
                        </div>
                        
                        <div class="h2">Тема</div>
                        <div class="form-item">
                            <div class="select">
                                <div class="select-button">
                                    <span class="select-button__text">Темная</span>
                                    <span class="select-button__arrow">
                                        <i class="fa fa-angle-right" aria-hidden="true"></i>
                                    </span>
                                </div>
                                <div class="select-spoller">
                                    <ul class="select-list">
                                        <li class="select-item">
                                            <input type="radio" name="theme" class="theme-input" id="theme-dark" value="dark">
                                            <label for="theme-dark" class="theme-label">Темная</label>
                                        </li>
                                        <li class="select-item">
                                            <input type="radio" name="theme" class="theme-input" id="theme-light" value="light">
                                            <label for="theme-light" class="theme-label">Светлая</label>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>

                        <div class="h2">Кастомный цвет</div>
                        <input type="color" name="theme-color" id="theme-color">
                    </div>

                </div>
            </div>

        </main>

    </div>
    
    <script src="./js/main.js"></script>
</body>
</html>
