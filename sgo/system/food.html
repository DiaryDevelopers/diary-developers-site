                    <!-- Блюда будут добавлены через JavaScript -->

    </div>

    <script>
        const dishes = [
            {
                name: "Гречневая каша с котлетой",
                category: "Блюдо школьной столовой",
                description: "Рассыпчатая гречневая крупа с сочной говяжьей котлетой, подаётся с подливой",
                image: "https://sun9-8.userapi.com/s/v1/ig2/jJLh-Nzmn0R6rMSQAZOfH4cTsvrAfw-6-VjmanNl9pFKlbcP3NYgqBMZjZb-fAvdBz23jnPUJ_qqZlBfVOTopKdq.jpg?quality=96&as=32x21,48x32,72x48,108x72,160x107,240x160,360x240,480x320,540x360,640x427,720x480,730x487&from=bu&u=dg3_p630WOe9W2tTf6LHeycehV4APqoRhNcqSH1EVaM&cs=730x487"
            },
            {
                name: "Овощной суп с курицей",
                category: "Блюдо школьной столовой",
                description: "Лёгкий суп с куриной грудкой, картофелем, морковью и вермишелью",
                image: "https://nutritiouslife.com/wp-content/uploads/2012/03/homemade-chicken-soup.jpg"
            },
            {
                name: "Творожная запеканка",
                category: "Блюдо школьной столовой",
                description: "Нежная запеканка из творога с изюмом, подаётся со сгущённым молоком",
                image: "https://avatars.mds.yandex.net/i?id=91e3d02febab33c8e72eb633bde4878f_l-9198382-images-thumbs&n=13"
            },
            {
                name: "Компот из сухофруктов",
                category: "Блюдо школьной столовой",
                description: "Традиционный витаминный напиток из сушёных яблок, груш и кураги",
                image: "https://avatars.mds.yandex.net/i?id=b2f101fcd3e5c0e5ee95de7aeed19a989f8940f2-10700817-images-thumbs&n=13"
            },
            {
                name: "Картофельное пюре с рыбной котлетой",
                category: "Блюдо школьной столовой",
                description: "Воздушное пюре с паровой котлетой из минтая, украшенное зеленью",
                image: "https://main-cdn.sbermegamarket.ru/hlr-system/-16/017/405/851/181/559/100029622416b0.jpg"
            },
            {
                name: "Макароны с сыром",
                category: "Блюдо школьной столовой",
                description: "Спагетти с расплавленным сыром и сливочным маслом",
                image: "https://amenu.ru/images/e.6beebd329140705cbd1d90c3815c1f49.jpg"
            }
        ];

        function createDishCard(dish) {
            return `
                <div class="dish-card">
                    <img src="${dish.image}" alt="${dish.name}" class="dish-image">
                    <div class="dish-category">${dish.category}</div>
                    <h3>${dish.name}</h3>
                    <p class="dish-description">${dish.description}</p>
                </div>
            `;
        }

        function generateRandomMenu() {
            const grid = document.getElementById('dishesGrid');
            grid.innerHTML = '';

            // Выбираем 3 случайных блюда
            const shuffled = dishes.sort(() => 0.5 - Math.random());
            const selected = shuffled.slice(0, 3);

            selected.forEach(dish => {
                grid.innerHTML += createDishCard(dish);
            });
        }

        // Показываем все блюда при первой загрузке
        document.getElementById('dishesGrid').innerHTML = dishes.map(createDishCard).join('');
    </script>
    <script src="./js/main.js"></script>
    <script src="./js/food.js"></script>
</body>
