                <li>

                    Настройки

        <div class="diary">

            <div class="left--side">
                <h1>
                    <i class='bx bxs-cog' ></i>
                    Настройки
                </h1>

              <div class="blocks" style="background: none; display: flex; width: 202%; justify-content: space-around;">

                  <div class="studentInformation block">
                      <p class="infoText">
                          <i class='bx bxs-id-card' ></i>
                          Пароль</p>
                      <div class="repass">
                          <p class="repassText">Изменить пароль</p>
                          <input placeholder="Пароль" type="password">
                          <input placeholder="Повтор пароля" type="password">
                          <button class="blockButton">Сменить пароль</button>
                      </div>
                  </div>

                  <div class="studentInformation block">
                      <p class="infoText">
                          <i class='bx bxs-envelope' ></i>
                          Почта</p>
                      <div class="repass">
                          <p class="repassText">Сменить почту</p>
                          <input placeholder="Старая почта" type="email">
                          <input placeholder="Новая почта" type="email">
                          <button class="blockButton">Сменить почту</button>
                      </div>
                  </div>

              </div>

                <div class="theme block">
                    <p class="infoText">
                        <i class='bx bx-adjust' ></i>
                        Тема</p>
                    <div style=" background: none; flex-direction: row; display: flex;">
                    <form>
                        <div class="__select" data-state="">
                            <div class="__select__title" data-default="Option 0">Системная</div>
                            <div class="__select__content" id="theme-select">
                                <input id="singleSelect0" class="__select__input" type="radio" name="singleSelect" checked value=""/>
                                <label for="singleSelect0" class="__select__label">Системная</label>
                                <input id="singleSelect1" class="__select__input" type="radio" name="singleSelect" value="dark"/>
                                <label for="singleSelect1" class="__select__label">Тёмная (базовая)</label>
                                <input id="singleSelect3" class="__select__input" type="radio" name="singleSelect" value="light"/>
                                <label for="singleSelect3" class="__select__label">Светлая (базовая)</label>
                            </div>
                        </div>
                    </form>

                    <div class="__custom__theme" style="flex-direction: column; margin: -60px 40px;">
                        <label for="customThemePicker">Кастомный цвет:</label>
                        <input type="color" id="customThemePicker" name="customThemePicker">
                    </div>
                </div>
                </div>

                <button class="logout">
                    <i class='bx bxs-door-open' ></i>
                    Выйти с аккаунта
                </button>

                <p class="devLog">for developers | ReDiary project | Version 1.3.23</p>

            </div>



        </div>


    </div>

    <script src="./scripts/selector.js"></script>
    <script src="../scripts/cookie.js"></script>

</body>
</html>
